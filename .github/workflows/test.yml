name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (xiaozhi-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'main/xiaozhi-server/requirements.txt'
      - name: Install system dependencies
        run: |
          # opuslib_next 是 ctypes 绑定，pip 装上的是纯 Python 包，真正的编解码
          # 靠系统里的 libopus.so。runner 上默认没有，import 会失败，音频相关的
          # 用例直接报错。正式镜像 Dockerfile-server-base 里也是装 libopus0 的
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
      - name: Install dependencies
        working-directory: main/xiaozhi-server
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio freezegun
      - name: Prepare test config
        working-directory: main/xiaozhi-server
        run: |
          # config/settings.py 在 import 期就要这个文件，缺了整套用例连收集都过不去。
          # data/ 在 .gitignore 里，只能由这一步现造
          mkdir -p data
          printf '{}\n' > data/.config.yaml
      - name: Run tests
        working-directory: main/xiaozhi-server
        run: |
          # Edge TTS 那条要连微软公网，runner 的出口 IP 会被风控挡掉，先排除。
          # 根治办法是给它打 live 标记，让 mock 模式下自动不收（另开一条改）
          RUN_LIVE_API_TESTS=0 pytest tests/core tests/config tests/plugins_func tests/test_llm.py tests/test_smoke.py -v -k "not test_tts_text_to_speak_writes_file"

  java:
    name: Java 21 and isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_MYSQL_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          TZ: UTC
        ports:
          - 34776:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 34777:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Prepare isolated schemas
        run: python3 dev/tests/ci_prepare_databases.py
      - name: Package and run tests
        working-directory: main/manager-api
        run: mvn -B -DskipTests=false -DargLine=-Xmx512m package
      - name: Verify base integration tests ran
        working-directory: main/manager-api
        run: bash scripts/check-integration-tests.sh
