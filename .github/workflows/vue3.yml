name: Server Vue 3 frontend
on:
  push:
    branches: [Dev, main]
    paths:
      - 'main/manager-web/**'
      - 'Dockerfile-web'
      - '.github/workflows/vue3.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'main/manager-web/**'
      - 'Dockerfile-web'
      - '.github/workflows/vue3.yml'
      - '.gitignore'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: main/manager-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:snapshot
      - run: npm run check:i18n
      - run: npm run build
