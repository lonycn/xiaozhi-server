openapi: 3.1.0
info:
  title: Xiaozhi persistent conversation ledger
  version: 0.3.0
  description: |
    P1 conversation ledger and B1 human text support are implemented. Conversation requires
    features.conversation-enabled=true; support additionally requires features.support-handoff-enabled=true.
    All feature flags default to false. B2 AI text execution and authenticated SSE additionally require
    features.ai-text-enabled=true together with conversation-enabled=true. Dev explicitly opts in;
    opt-in does not enable the feature in other environments. Media/Omni/LiveKit remain planned.
    User-message persistence is independent of model completion; only AI_ACTIVE schedules AI execution.
    The internal worker protocol is documented in [B2_IMPLEMENTATION_CONTRACT.md](./B2_IMPLEMENTATION_CONTRACT.md)
    and [the independent Python worker README](../../main/xiaozhi-server/ai_worker/README.md).
    Worker-key authentication grants no public API access. Private keys and lease tokens never appear in public Run responses.
    The legacy history bridge is read-only and does not import records into conversations or model context.
    All success bodies use {code: 0, msg: success, data: ...}. Errors use actual HTTP status and a Result body.
    Unknown request fields are rejected; identities are supplied by the authenticated server session.
    Response long IDs, sequences and cursors are decimal strings (for example last_seq: "3");
    preserve them as strings in JavaScript and never convert long IDs to Number. Null values remain null.
servers:
  - url: /xiaozhi
security:
  - bearerAuth: []
paths:
  /api/v1/ai/conversations:
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
      responses:
        '200':
          description: Persisted conversation
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      operationId: listConversations
      parameters:
        - name: before
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
          description: Exclusive list_sequence cursor; 0 starts at newest creation.
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Owner's conversations in descending list_sequence order
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/ai/conversations/{id}:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: getConversation
      responses:
        '200':
          description: Owner's conversation
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    post:
      operationId: appendUserMessage
      description: Saving an AI_ACTIVE user message may queue an assistant run in the same transaction when AI-text is enabled; human states only save the user message. A successful save is not model completion. Idempotent retries do not queue duplicate runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './MESSAGE_SCHEMA.json'}
            example:
              client_message_id: phone-uuid-001
              parts:
                - {type: text, text: 运行时有异响}
      responses:
        '200':
          description: Saved user message or identical previous message on idempotent retry
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/Unsupported'}
    get:
      operationId: listMessages
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Messages in ascending seq order
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/conversations/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: replayEvents
      description: Durable JSON event replay, also used as the polling fallback for B2 authenticated SSE. Message and event sequence spaces are independent.
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Events in ascending sequence order
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/ConversationEvent'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/conversations/{id}/handoff:
    post:
      operationId: handoffConversation
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Handoff'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai/conversations/{id}/resume-ai:
    post:
      operationId: resumeAi
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/me:
    get:
      operationId: getCurrentSupportAgent
      description: Any authenticated enabled account can read its own enabled profile, or null when absent/disabled. Does not renew presence or grant staff permissions.
      responses:
        '200':
          description: Current enabled staff profile or null
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        oneOf:
                          - {$ref: '#/components/schemas/SupportAgent'}
                          - {type: 'null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/support/assigned:
    get:
      operationId: listCurrentSupportAssignments
      description: Requires support:queue:read and an enabled staff profile/account. Only active requests with this actor as current assignee and an unreleased assignment are returned; historical assignments grant no live metadata access. Presence expiry does not hide current assignments.
      parameters:
        - {name: before, in: query, description: Exclusive list_sequence cursor; zero starts the list., schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Current assignments ordered by list_sequence descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/SupportRequest'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/support/agents:
    get:
      operationId: listSupportAgents
      description: Requires support:agents:manage and an enabled super-admin account. Includes disabled profiles/accounts for management. Lists existing profiles only and grants no conversation access.
      parameters:
        - {name: before, in: query, description: Exclusive user_id cursor; zero starts the list., schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Staff profiles ordered by user_id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/SupportAgentSummary'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/support/agents/{userId}:
    put:
      operationId: updateSupportAgent
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentUpdate'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportAgent'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/presence:
    post:
      operationId: updateSupportPresence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceUpdate'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportAgent'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/queue:
    get:
      operationId: listSupportQueue
      parameters:
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/SupportRequest'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}:
    get:
      operationId: getSupportRequest
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}/claim:
    post:
      operationId: claimSupportRequest
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}/messages:
    post:
      operationId: sendSupportMessage
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupportSendMessage'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}/resolve:
    post:
      operationId: resolveSupportRequest
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}/cancel:
    post:
      operationId: cancelSupportRequest
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/requests/{id}/requeue:
    post:
      operationId: requeueSupportRequest
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data: {$ref: '#/components/schemas/SupportRequest'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai/conversations/{id}/runs:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: listAiRuns
      description: Requires both conversation and AI-text flags. Owner or current authorized assignee; released staff cannot read mutable Run metadata. Ordered by list_sequence descending.
      parameters:
        - {name: before, in: query, description: Exclusive list_sequence; 0 starts at newest., schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Persisted runs; all long sequences/cursors are decimal strings
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/AiRun'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/conversations/{id}/runs/{runId}:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getAiRun
      description: Same mutable-resource access boundary as listAiRuns. IDs must belong to the requested conversation.
      responses:
        '200': {$ref: '#/components/responses/AiRunResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/conversations/{id}/runs/{runId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelAiRun
      description: Owner operation. Active runs become canceled; partial text remains. Canceling an already terminal run returns its current state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyRequest'}
      responses:
        '200': {$ref: '#/components/responses/AiRunResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai/conversations/{id}/runs/{runId}/retry:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: retryAiRun
      description: Owner operation in AI_ACTIVE only. Only failed/canceled runs for the latest user input with no other active run and attempt below 3 are eligible. Queuing preserves the previous partial output and attempt; the next successful claim increments attempt and emits reset before new output.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyRequest'}
      responses:
        '200': {$ref: '#/components/responses/AiRunResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai/conversations/{id}/stream:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: streamConversationEvents
      description: |
        Authenticated fetch SSE; Authorization must be a Bearer header, never a URL token.
        The nonblank Last-Event-ID header overrides after. Both are nonnegative int64 decimal cursors.
        Replays persisted ConversationEvent envelopes, then tails them. id is the event sequence,
        event is its type, and data is the complete JSON envelope. Heartbeat comments are not events.
        Each connection lasts at most approximately 25 seconds, with batch authorization rechecks
        and a maximum of 16 concurrent streams per controller instance. Reconnect with the last
        successfully applied sequence as both after and Last-Event-ID. Keep decimal strings and use
        BigInt comparisons; deduplicate events by sequence. JSON /events polling remains available.
        Recheck permissions on every batch, including account disablement and released-assignment cutoffs;
        revocation or a database read failure after headers closes the connection at the last flushed
        event cursor. Initial transient database failures use JSON 503 STREAM_UNAVAILABLE;
        other initial errors use the normal Result HTTP body.
        Reconstruct assistant text from ordered events rather than appending historical deltas to a
        message snapshot with no event watermark. Reset replaces text for that attempt; reject older
        attempts and repeated chunk_sequence values. Snapshot refreshes must not overwrite a newer event projection.
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {name: Last-Event-ID, in: header, schema: {type: string, pattern: '^[0-9]+$'}, description: Last successfully applied event sequence; takes precedence over after.}
      responses:
        '200':
          description: Bounded authenticated SSE connection with heartbeat comments
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                id: 12
                event: assistant.text.delta
                data: {"event_id":"event-example","conversation_id":"conversation-example","sequence":"12","type":"assistant.text.delta","data":{"run_id":"run-example","message_id":"message-example","attempt":1,"chunk_sequence":"1","text":"你好"},"timestamp":"2026-10-30T00:00:00Z"}

                : heartbeat

        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: STREAM_CAPACITY; bounded connection capacity reached, back off and retain polling fallback
          content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
        '503':
          description: STREAM_UNAVAILABLE; storage temporarily unavailable before SSE headers, retain the cursor and retry
          content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
  /api/v1/ai/legacy/agents/{agentId}/sessions:
    parameters:
      - {$ref: '#/components/parameters/LegacyAgentId'}
    get:
      operationId: listReadonlyLegacySessions
      description: |
        Requires conversation-enabled only, independently of AI-text opt-in. Enabled owner of the exact
        agent only; this is not a support-assignment API. Reads existing ai_agent_chat_history grouped
        by nonempty session_id, ordered by MIN(source id) descending. Does not write or automatically
        import history into the unified conversation ledger, AI task queue, or model context.
      parameters:
        - {name: before, in: query, description: Exclusive first_message_id cursor; 0 starts newest., schema: {type: string, pattern: '^[0-9]{1,19}$', default: '0'}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Read-only source sessions, preserving session/source IDs
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/LegacySession'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/legacy/agents/{agentId}/sessions/{sessionId}/messages:
    parameters:
      - {$ref: '#/components/parameters/LegacyAgentId'}
      - {name: sessionId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 50}, description: Source session_id; slash and control characters rejected.}
    get:
      operationId: listReadonlyLegacyMessages
      description: |
        Same exact agent-owner boundary as legacy session listing. Reads source records in ascending
        source_id order. chat_type 1 maps to user, 2 to assistant, others to unknown. read_only is always
        true. has_audio is only an existence flag; no audio bytes, provider credentials, or storage URL
        are exposed. There is no legacy import, update, delete, send, or model-execution endpoint.
      parameters:
        - {name: after, in: query, schema: {type: string, pattern: '^[0-9]{1,19}$', default: '0'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: Read-only source messages; cursor is last returned source_id even on the final page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Result'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/CursorPage'}
                          - properties:
                              items: {type: array, items: {$ref: '#/components/schemas/LegacyMessage'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
    LegacyAgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,32}$'}
    ConversationId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    After:
      name: after
      in: query
      schema: {type: integer, format: int64, minimum: 0, default: 0}
      description: Exclusive message/event sequence cursor.
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  responses:
    AiRunResult:
      description: Persisted public run state; no worker key, lease capability, provider request headers, or credentials
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Result'}
              - properties:
                  data: {$ref: '#/components/schemas/AiRun'}
    Invalid:
      description: Invalid input, unknown fields, or unavailable project context
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
    Unauthorized:
      description: Authentication required (existing localized Result body)
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
    Forbidden:
      description: Permission or resource access denied
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
    NotFound:
      description: Conversation missing or inaccessible; same response for both
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
    Conflict:
      description: State, capacity, or idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
    Unsupported:
      description: MESSAGE_PART_NOT_SUPPORTED (media pipeline not enabled)
      content: {application/json: {schema: {$ref: '#/components/schemas/Result'}}}
  schemas:
    Result:
      type: object
      required: [code, msg, data]
      properties:
        code: {type: integer}
        msg: {type: string}
        data: {}
    CursorPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: string, pattern: '^[0-9]+$'}
        has_more: {type: boolean}
    CreateConversation:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        agent_id: {type: [string, 'null'], pattern: '^[a-zA-Z0-9_-]{1,32}$'}
    Conversation:
      type: object
      required: [id, list_sequence, title, state, last_seq, last_event_seq, created_at, updated_at]
      properties:
        id: {type: string}
        list_sequence: {type: string, pattern: '^[0-9]+$'}
        agent_id: {type: [string, 'null']}
        title: {type: string}
        state: {enum: [AI_ACTIVE, HUMAN_QUEUED, HUMAN_ACTIVE, RESOLVED]}
        last_seq: {type: string, pattern: '^[0-9]+$'}
        last_event_seq: {type: string, pattern: '^[0-9]+$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MessagePart:
      oneOf:
        - {$ref: './MESSAGE_SCHEMA.json#/$defs/AssistantTextPart'}
        - {$ref: './MESSAGE_SCHEMA.json#/$defs/LocationPart'}
    Message:
      type: object
      required: [id, conversation_id, seq, client_message_id, sender_type, sender_id, parts, status, created_at]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        seq: {type: string, pattern: '^[0-9]+$'}
        client_message_id: {type: string}
        sender_type: {enum: [user, assistant, support_agent, expert]}
        sender_id: {type: string}
        parts: {type: array, items: {$ref: '#/components/schemas/MessagePart'}}
        status: {enum: [accepted, queued, running, streaming, completed, failed, canceled]}
        created_at: {type: string, format: date-time}
    ConversationEvent:
      type: object
      required: [event_id, conversation_id, sequence, type, data, timestamp]
      properties:
        event_id: {type: string}
        conversation_id: {type: string}
        sequence: {type: string, pattern: '^[0-9]+$'}
        type: {enum: [conversation.created, message.accepted, support.requested, support.queued, support.taken_over, support.message.created, support.resolved, support.canceled, support.requeued, ai.resumed, ai.run.queued, ai.run.started, ai.run.failed, ai.run.canceled, assistant.message.created, assistant.message.reset, assistant.text.delta, assistant.message.completed]}
        data:
          type: object
          description: B1 payloads remain unchanged. B2 AI events have run_id, message_id and numeric attempt; deltas additionally have decimal-string chunk_sequence and text, created has message seq, and failures may include sanitized error_code. See MESSAGE_SCHEMA.json AiEventData.
        timestamp: {type: string, format: date-time}
    Attachment:
      x-implementation: planned-P2
      type: object
      required: [id, mime, size_bytes, sha256, status]
      properties:
        id: {type: string}
        mime: {type: string}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string}
        status: {enum: [pending_upload, validating, ready, failed, expired]}
      description: Private server-owned storage key; clients receive only short-lived authorized URLs.
    RealtimeSession:
      x-implementation: planned-P3
      type: object
      required: [id, conversation_id, channel, provider, status]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        channel: {enum: [audio, video]}
        provider: {enum: [qwen_omni_realtime, livekit]}
        status: {enum: [created, connecting, active, ended, failed]}
    SupportRequest:
      type: object
      required: [request_id, list_sequence, conversation_id, client_request_id, status, requested_mode]
      properties:
        request_id: {type: string}
        list_sequence: {type: string, pattern: '^[0-9]+$'}
        conversation_id: {type: string}
        client_request_id: {type: string}
        status: {enum: [queued, active, resolved, canceled]}
        requested_mode: {const: text}
        target_agent_user_id: {type: [string, 'null'], pattern: '^[0-9]+$'}
        assigned_agent_user_id: {type: [string, 'null'], pattern: '^[0-9]+$'}
        requested_at: {type: string, format: date-time}
        assigned_at: {type: [string, 'null'], format: date-time}
        first_response_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason: {type: [string, 'null']}
    SupportAgent:
      type: object
      properties:
        user_id: {type: string, pattern: '^[0-9]+$'}
        role: {enum: [support_agent, expert]}
        enabled: {type: boolean}
        capacity_text: {type: integer, minimum: 1, maximum: 20}
        accepting: {type: boolean}
        presence_expires_at: {type: [string, 'null'], format: date-time}
    SupportAgentSummary:
      allOf:
        - {$ref: '#/components/schemas/SupportAgent'}
        - type: object
          required: [username, account_enabled]
          properties:
            username: {type: string}
            account_enabled: {type: boolean}
    Handoff:
      type: object
      additionalProperties: false
      required: [client_request_id, requested_mode]
      properties:
        client_request_id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,63}$'}
        requested_mode: {const: text}
        target_agent_user_id:
          oneOf:
            - {type: integer, format: int64, minimum: 1}
            - {type: string, pattern: '^[0-9]+$'}
            - {type: 'null'}
          description: Decimal strings are accepted; avoid JavaScript Number for long IDs.
    AgentUpdate:
      type: object
      additionalProperties: false
      required: [role, enabled, capacity_text]
      properties:
        role: {enum: [support_agent, expert]}
        enabled: {type: boolean}
        capacity_text: {type: integer, minimum: 1, maximum: 20}
    PresenceUpdate:
      type: object
      additionalProperties: false
      required: [accepting]
      properties:
        accepting: {type: boolean}
    EndRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
    EmptyRequest:
      type: object
      additionalProperties: false
    SupportSendMessage:
      type: object
      additionalProperties: false
      required: [client_message_id, parts]
      properties:
        client_message_id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,63}$'}
        parts: {type: array, minItems: 1, maxItems: 16, items: {$ref: './MESSAGE_SCHEMA.json#/$defs/TextPart'}}
    SupportAssignment:
      x-implementation: internal-persistence
      description: Internal assignment history; no public assignment CRUD API.
      type: object
      properties:
        id: {type: string}
        request_id: {type: string}
        conversation_id: {type: string}
        agent_user_id: {type: string, pattern: '^[0-9]+$'}
        assigned_at: {type: string, format: date-time}
        released_at: {type: [string, 'null'], format: date-time}
        read_through_seq: {type: [string, 'null'], pattern: '^[0-9]+$'}
        read_through_event_seq: {type: [string, 'null'], pattern: '^[0-9]+$'}
    AiRun:
      type: object
      description: |
        Java/MySQL owns state. One active run per conversation; a new user message cancels the previous
        active run and preserves its partial output. User-message idempotency does not enqueue twice.
        Assistant output updates the same output_message_id, never creates a message per token.
        Attempts are incremented on claim; expired leases can recover up to three attempts. A recovery
        emits assistant.message.reset before new text. Manual retry only requeues eligible latest input.
        Human-mode/epoch changes invalidate active runs and late callbacks cannot publish new output.
      required: [run_id, list_sequence, conversation_id, input_message_id, output_message_id, status, control_epoch, attempt, model, last_chunk_sequence, error_code, usage, created_at, updated_at]
      properties:
        run_id: {type: string}
        list_sequence: {type: string, pattern: '^[0-9]+$'}
        conversation_id: {type: string}
        input_message_id: {type: string}
        output_message_id: {type: string}
        status: {enum: [queued, running, streaming, completed, failed, canceled]}
        control_epoch: {type: string, pattern: '^[0-9]+$'}
        attempt: {type: integer, minimum: 0, maximum: 3}
        model: {type: string}
        last_chunk_sequence: {type: string, pattern: '^[0-9]+$'}
        error_code: {type: [string, 'null'], description: Sanitized provider/worker code or server recovery code such as RETRY_EXHAUSTED; never a provider error body.}
        usage:
          oneOf:
            - {$ref: './MESSAGE_SCHEMA.json#/$defs/TokenUsage'}
            - {type: 'null'}
          description: Actual provider-reported usage; absent usage stays null and is never estimated.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LegacySession:
      type: object
      required: [session_id, first_message_id, last_message_id, message_count, created_at, updated_at]
      properties:
        session_id: {type: string}
        first_message_id: {type: string, pattern: '^[0-9]+$'}
        last_message_id: {type: string, pattern: '^[0-9]+$'}
        message_count: {type: string, pattern: '^[0-9]+$'}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    LegacyMessage:
      type: object
      required: [source_id, session_id, sender_type, parts, created_at, read_only, has_audio]
      properties:
        source_id: {type: string, pattern: '^[0-9]+$'}
        session_id: {type: string}
        sender_type: {enum: [user, assistant, unknown]}
        parts:
          type: array
          items:
            type: object
            properties:
              type: {const: text}
              text: {type: [string, 'null']}
        created_at: {type: [string, 'null'], format: date-time}
        read_only: {const: true}
        has_audio: {type: boolean}
    Annotation:
      x-implementation: planned-P5
      type: object
      required: [id, source_attachment_id, vector_json, preview_attachment_id, author_id]
      properties:
        id: {type: string}
        source_attachment_id: {type: string}
        video_time_ms: {type: integer, minimum: 0}
        vector_json: {type: object, description: Shapes in normalized 0..1 coordinates}
        preview_attachment_id: {type: string}
        author_id: {type: string}
      description: Preserve original; source/preview permissions follow the conversation.
