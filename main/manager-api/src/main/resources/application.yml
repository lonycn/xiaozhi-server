# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

# Persistent conversation ledger (P1 foundation); opt in explicitly.
features:
  conversation-enabled: false
  support-handoff-enabled: false
  ai-text-enabled: false
  attachments-enabled: false
  annotations-enabled: false
  support-media-enabled: false
  external-identity-enabled: false

# Worker credential is dedicated to this execution protocol and never a user/server token.
ai:
  worker:
    key: ${AI_WORKER_KEY:}
  execution:
    model: ${AI_EXECUTION_MODEL:qwen-flash}
    lease-seconds: 45

# B3 private evidence namespace. Never point this at a pre-existing upload directory.
media:
  worker:
    key: ${MEDIA_WORKER_KEY:}
  ticket-key: ${MEDIA_TICKET_KEY:}
  lease-seconds: 90
  retention-seconds: 86400
  transcription-enabled: false
  storage:
    type: ${MEDIA_STORAGE_TYPE:filesystem}
    root: ${MEDIA_STORAGE_ROOT:./data/b3-private-attachments}
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:}
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:}
      prefix: ${MEDIA_S3_PREFIX:b3-private-attachments/}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}

# B5 uses private, explicit credentials and a dedicated room namespace on shared LiveKit.
support-media:
  livekit:
    internal-url: ${SUPPORT_LIVEKIT_INTERNAL_URL:}
    public-url: ${SUPPORT_LIVEKIT_PUBLIC_URL:}
    api-key: ${SUPPORT_LIVEKIT_API_KEY:}
    api-secret: ${SUPPORT_LIVEKIT_API_SECRET:}
    room-prefix: ${SUPPORT_LIVEKIT_ROOM_PREFIX:xz-support-b5-}
    request-timeout-millis: 5000
    token-ttl-seconds: 60
  invitation-seconds: 45
  transfer-seconds: 60
  ready-seconds: 15
  reconnect-seconds: 60
  maintenance-delay-ms: 3000
# B6 uses its own xiaozhi-* issuer/key namespace; never reuse the original App SSO keys.
external-identity:
  keys-json: ${EXTERNAL_IDENTITY_KEYS_JSON:}
  token-seconds: 300
