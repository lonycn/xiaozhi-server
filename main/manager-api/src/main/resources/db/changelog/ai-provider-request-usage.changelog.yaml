databaseChangeLog:
  - changeSet:
      id: 202611010202
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE ai_provider_request_usage (
                run_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                attempt INT NOT NULL,
                round_number INT NOT NULL,
                model VARCHAR(160) NOT NULL,
                provider_request_id VARCHAR(200) NULL,
                finish_reason VARCHAR(32) NULL,
                input_tokens BIGINT NULL,
                output_tokens BIGINT NULL,
                total_tokens BIGINT NULL,
                input_audio_tokens BIGINT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                PRIMARY KEY (run_id,attempt,round_number),
                CONSTRAINT fk_ai_provider_usage_run FOREIGN KEY (run_id) REFERENCES ai_run(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
