databaseChangeLog:
  - changeSet:
      id: 202611020610-ai-skills
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE ai_skill_selection (
                conversation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                owner_user_id BIGINT NOT NULL,
                skill_id VARCHAR(64) NULL,
                skill_version INT NULL,
                updated_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_ai_skill_conversation FOREIGN KEY(conversation_id) REFERENCES ai_conversation(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_skill_selection_audit (
                sequence BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                conversation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                owner_user_id BIGINT NOT NULL,
                client_request_id VARCHAR(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                skill_id VARCHAR(64) NULL,
                skill_version INT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                UNIQUE KEY uk_ai_skill_request(conversation_id,client_request_id),
                CONSTRAINT fk_ai_skill_audit_conversation FOREIGN KEY(conversation_id) REFERENCES ai_conversation(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_skill_run_snapshot (
                run_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                conversation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                skill_id VARCHAR(64) NOT NULL,
                skill_version INT NOT NULL,
                instruction_text TEXT NOT NULL,
                allowed_tools_json TEXT NOT NULL,
                source_policy VARCHAR(100) NOT NULL,
                snapshot_hash CHAR(64) NOT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_ai_skill_run FOREIGN KEY(run_id) REFERENCES ai_run(id),
                CONSTRAINT fk_ai_skill_run_conversation FOREIGN KEY(conversation_id) REFERENCES ai_conversation(id),
                CHECK(JSON_VALID(allowed_tools_json))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
