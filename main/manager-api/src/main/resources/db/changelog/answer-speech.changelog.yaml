databaseChangeLog:
  - changeSet:
      id: 202611020600-answer-speech
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE ai_answer_speech_job (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                conversation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                message_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                owner_user_id BIGINT NOT NULL,
                client_request_id VARCHAR(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                message_version CHAR(64) NOT NULL,
                text_sha256 CHAR(64) NOT NULL,
                text_snapshot MEDIUMTEXT NOT NULL,
                principal_json LONGTEXT NULL,
                model VARCHAR(100) NOT NULL,
                voice VARCHAR(100) NOT NULL,
                status VARCHAR(24) NOT NULL,
                error_code VARCHAR(64) NULL,
                attempt INT NOT NULL DEFAULT 0,
                audio_path VARCHAR(300) NULL,
                audio_sha256 CHAR(64) NULL,
                audio_bytes BIGINT NULL,
                duration_ms INT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                updated_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                active_slot TINYINT GENERATED ALWAYS AS(CASE WHEN status IN ('queued','synthesizing') THEN 1 ELSE NULL END) STORED,
                UNIQUE KEY uk_answer_speech_client(owner_user_id,client_request_id),
                UNIQUE KEY uk_answer_speech_active(owner_user_id,active_slot),
                KEY ix_answer_speech_queue(status,created_at),
                CONSTRAINT fk_answer_speech_conversation FOREIGN KEY(conversation_id) REFERENCES ai_conversation(id),
                CONSTRAINT fk_answer_speech_message FOREIGN KEY(message_id) REFERENCES ai_message(id),
                CHECK(principal_json IS NULL OR JSON_VALID(principal_json)),
                CHECK(status IN ('queued','synthesizing','completed','failed','canceled'))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_answer_speech_attempt (
                job_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                attempt INT NOT NULL,
                lease_hash CHAR(64) NOT NULL,
                worker_id VARCHAR(100) NOT NULL,
                lease_expires_at DATETIME(3) NOT NULL,
                dispatched_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                PRIMARY KEY(job_id,attempt),
                CONSTRAINT fk_answer_speech_attempt FOREIGN KEY(job_id) REFERENCES ai_answer_speech_job(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_answer_speech_usage (
                sequence BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                job_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                attempt INT NOT NULL,
                report_hash CHAR(64) NOT NULL,
                model VARCHAR(100) NOT NULL,
                provider_request_id VARCHAR(200) NULL,
                characters BIGINT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                UNIQUE KEY uk_answer_speech_usage(job_id,attempt),
                CONSTRAINT fk_answer_speech_usage FOREIGN KEY(job_id,attempt) REFERENCES ai_answer_speech_attempt(job_id,attempt),
                CHECK(characters IS NULL OR characters>=0)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_answer_speech_audit (
                sequence BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                job_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                attempt INT NOT NULL,
                state VARCHAR(30) NOT NULL,
                error_code VARCHAR(64) NULL,
                audio_sha256 CHAR(64) NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_answer_speech_audit FOREIGN KEY(job_id) REFERENCES ai_answer_speech_job(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
