databaseChangeLog:
  - changeSet:
      id: 20261102-esp32-conversation
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE esp32_device_session (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                device_id VARCHAR(128) NOT NULL,
                binding_version VARCHAR(64) NOT NULL,
                owner_user_id BIGINT NOT NULL,
                agent_id VARCHAR(32) NOT NULL,
                conversation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL UNIQUE,
                channel VARCHAR(16) NOT NULL DEFAULT 'esp32',
                interaction_mode VARCHAR(16) NOT NULL DEFAULT 'ai_only',
                execution_mode VARCHAR(32) NOT NULL,
                connection_id VARCHAR(64) NOT NULL,
                gateway_id VARCHAR(64) NOT NULL,
                generation BIGINT NOT NULL,
                control_version BIGINT NOT NULL DEFAULT 0,
                last_turn_seq BIGINT NOT NULL DEFAULT 0,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                UNIQUE KEY uk_esp32_binding (device_id,binding_version),
                INDEX idx_esp32_owner (owner_user_id,device_id),
                CONSTRAINT fk_esp32_conversation FOREIGN KEY (conversation_id) REFERENCES ai_conversation(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE esp32_voice_turn (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                session_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                input_key VARCHAR(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                request_hash CHAR(64) NOT NULL,
                turn_seq BIGINT NOT NULL,
                control_version BIGINT NOT NULL,
                connection_id VARCHAR(64) NOT NULL,
                generation BIGINT NOT NULL,
                execution_mode VARCHAR(32) NOT NULL,
                input_message_id VARCHAR(32) NOT NULL,
                output_message_id VARCHAR(32) NULL,
                output_hash CHAR(64) NULL,
                status VARCHAR(32) NOT NULL,
                failure_code VARCHAR(64) NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                UNIQUE KEY uk_esp32_input (session_id,input_key),
                UNIQUE KEY uk_esp32_turn_sequence (session_id,turn_seq),
                CONSTRAINT fk_esp32_turn_session FOREIGN KEY (session_id) REFERENCES esp32_device_session(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE esp32_turn_report (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                turn_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                event_key VARCHAR(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                event_type VARCHAR(32) NOT NULL,
                request_hash CHAR(64) NOT NULL,
                data_json LONGTEXT NOT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                UNIQUE KEY uk_esp32_turn_report (turn_id,event_key),
                CONSTRAINT fk_esp32_report_turn FOREIGN KEY (turn_id) REFERENCES esp32_voice_turn(id),
                CONSTRAINT chk_esp32_report_json CHECK (JSON_VALID(data_json))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
