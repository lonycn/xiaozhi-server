databaseChangeLog:
  - changeSet:
      id: 202611031330-esp32-intents
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE esp32_intent_head (
                agent_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                revision BIGINT NOT NULL,
                published_version BIGINT NOT NULL,
                draft_json MEDIUMTEXT NOT NULL
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE esp32_intent_version (
                agent_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                version BIGINT NOT NULL,
                policy_json MEDIUMTEXT NOT NULL,
                published_by BIGINT NOT NULL,
                published_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                PRIMARY KEY(agent_id,version)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              ALTER TABLE esp32_voice_turn
                ADD COLUMN intent_action VARCHAR(12) NULL,
                ADD COLUMN intent_rule VARCHAR(48) NULL,
                ADD COLUMN intent_version BIGINT NULL,
                ADD COLUMN intent_reply VARCHAR(512) NULL;
