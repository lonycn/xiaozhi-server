databaseChangeLog:
  - changeSet:
      id: 202611020400-realtime-tools
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE ai_realtime_tool_binding (
                session_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                owner_user_id BIGINT NOT NULL,
                control_epoch BIGINT NOT NULL,
                principal_json LONGTEXT NULL,
                source_config_hash CHAR(64) NULL,
                technical_allowed TINYINT NOT NULL DEFAULT 0,
                turn_generation BIGINT NOT NULL DEFAULT 0,
                message_cutoff BIGINT NOT NULL,
                current_response_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_rt_tool_binding FOREIGN KEY(session_id) REFERENCES ai_realtime_session(id),
                CHECK(principal_json IS NULL OR JSON_VALID(principal_json))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_realtime_provider_response (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                session_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                provider_session_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                response_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                turn_generation BIGINT NOT NULL,
                control_epoch BIGINT NOT NULL,
                lease_hash CHAR(64) NOT NULL,
                logical_turn_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                message_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                step_number INT NOT NULL,
                status VARCHAR(24) NOT NULL,
                prefix_text MEDIUMTEXT NOT NULL,
                continuation_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NULL UNIQUE,
                continued_response_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                ended_at DATETIME(3) NULL,
                UNIQUE KEY uk_rt_tool_response(session_id,response_id),
                CONSTRAINT fk_rt_tool_response_session FOREIGN KEY(session_id) REFERENCES ai_realtime_session(id),
                CONSTRAINT fk_rt_tool_response_turn FOREIGN KEY(logical_turn_id) REFERENCES ai_realtime_turn(id),
                CHECK(status IN ('streaming','waiting_tools','continued','completed','canceled','discarded'))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_realtime_response_usage (
                response_row_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                provider_event_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                finish_reason VARCHAR(32) NULL,
                input_tokens BIGINT NULL,
                output_tokens BIGINT NULL,
                total_tokens BIGINT NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_rt_response_usage FOREIGN KEY(response_row_id) REFERENCES ai_realtime_provider_response(id),
                CHECK(input_tokens IS NULL OR input_tokens>=0),CHECK(output_tokens IS NULL OR output_tokens>=0),CHECK(total_tokens IS NULL OR total_tokens>=0)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_realtime_tool_call (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                session_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                response_row_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                provider_call_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                provider_item_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                result_item_id VARCHAR(100) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                tool_name VARCHAR(64) NOT NULL,
                tool_version INT NOT NULL DEFAULT 1,
                arguments_json LONGTEXT NOT NULL,
                arguments_hash CHAR(64) NOT NULL,
                turn_generation BIGINT NOT NULL,
                control_epoch BIGINT NOT NULL,
                lease_hash CHAR(64) NOT NULL,
                round_number INT NOT NULL,
                status VARCHAR(20) NOT NULL,
                result_json LONGTEXT NULL,
                error_code VARCHAR(64) NULL,
                result_bytes INT NOT NULL DEFAULT 0,
                acknowledged_at DATETIME(3) NULL,
                ack_provider_item_id VARCHAR(200) CHARACTER SET ascii COLLATE ascii_bin NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                finished_at DATETIME(3) NULL,
                UNIQUE KEY uk_rt_provider_call(session_id,provider_call_id),
                UNIQUE KEY uk_rt_result_item(session_id,result_item_id),
                UNIQUE KEY uk_rt_ack_item(session_id,ack_provider_item_id),
                CONSTRAINT fk_rt_tool_call_session FOREIGN KEY(session_id) REFERENCES ai_realtime_session(id),
                CONSTRAINT fk_rt_tool_call_response FOREIGN KEY(response_row_id) REFERENCES ai_realtime_provider_response(id),
                CHECK(JSON_VALID(arguments_json)),CHECK(result_json IS NULL OR JSON_VALID(result_json)),
                CHECK(status IN ('running','succeeded','failed','discarded'))
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_realtime_tool_attempt (
                id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin PRIMARY KEY,
                call_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                lease_hash CHAR(64) NOT NULL,
                control_epoch BIGINT NOT NULL,
                turn_generation BIGINT NOT NULL,
                started_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_rt_tool_attempt FOREIGN KEY(call_id) REFERENCES ai_realtime_tool_call(id),
                UNIQUE KEY uk_rt_tool_attempt(call_id,lease_hash)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              CREATE TABLE ai_realtime_tool_audit (
                sequence BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                call_id VARCHAR(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,
                event_sequence BIGINT NOT NULL,
                state VARCHAR(24) NOT NULL,
                error_code VARCHAR(64) NULL,
                elapsed_ms BIGINT NOT NULL DEFAULT 0,
                result_hash CHAR(64) NULL,
                created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                CONSTRAINT fk_rt_tool_audit FOREIGN KEY(call_id) REFERENCES ai_realtime_tool_call(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
